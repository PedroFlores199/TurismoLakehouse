[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="turismo-lakehouse"
version="1.0.0"
description="Plataforma medallion de datos turísticos de Andalucía"
requires-python=">=3.12"
dependencies=["pandas>=2.2,<3","httpx>=0.28,<1","fastapi>=0.115,<1","uvicorn>=0.30,<1","statsmodels>=0.14,<1","numpy>=2,<3"]
[project.optional-dependencies]
etl=["pyspark==4.0.1","delta-spark==4.0.0","pyarrow>=19"]
test=["pytest>=8","jsonschema>=4","build>=1","ruff>=0.17,<1"]
[tool.hatch.build.targets.wheel]
packages=["tourism"]
[project.scripts]
tourism-pipeline="tourism.pipeline:main"
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope="function"
testpaths=["tests"]
