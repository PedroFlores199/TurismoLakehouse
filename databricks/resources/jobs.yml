resources:
  jobs:
    medallion:
      name: Turismo medallion / ${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: pipeline
          python_wheel_task:
            package_name: turismo_lakehouse
            entry_point: tourism-pipeline
            parameters: [--root, "${var.landing_root}", --offline, --catalog, "${var.catalog}"]
          libraries:
            - whl: ../../dist/*.whl
          job_cluster_key: jobs
          timeout_seconds: 3600
      job_clusters:
        - job_cluster_key: jobs
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4ds_v5
            num_workers: 1
            data_security_mode: USER_ISOLATION
